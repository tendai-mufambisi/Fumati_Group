# Every push to main builds the site and deploys it to fumatigroup.digitsdigital.co.zw.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template, plus D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  — a86d4961884d9fece54eda7fafc17be2
# ADMIN_SECRET lives on the Worker itself and survives every deploy.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.ready == 'true'

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: bun run build && node scripts/patch-wrangler.mjs

      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply fumati-group --remote -c .output/server/wrangler.json

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy -c .output/server/wrangler.json
